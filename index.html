<!DOCTYPE html>
<html lang="it">

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="favicon.png" type="image.png" />
	<meta http-equiv="Cache-Control" content="no-cache">
	<meta http-equiv="Pragma" content="no-cache">
	<title></title>
	<meta charset="UTF-8"/>
	<script defer src="alpine-3.15.12.min.js"></script>
	<style>
		/* ================= Material Design 3 theme ================= */
		:root {
			--md-primary: #6750a4;
			--md-on-primary: #ffffff;
			--md-primary-container: #eaddff;
			--md-on-primary-container: #21005d;
			--md-bg: #f6f2fb;
			--md-surface: #ffffff;
			--md-surface-container: #ece7f0;
			--md-on-surface: #1d1b20;
			--md-on-surface-variant: #49454f;
			--md-outline: #79747e;
			--md-outline-variant: #cac4d0;
			--md-error: #b3261e;
			--md-error-container: #f9dedc;
			--md-elev-1: 0 1px 2px rgba(0,0,0,.28), 0 1px 3px 1px rgba(0,0,0,.12);
			--md-elev-2: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.14);
			--md-elev-3: 0 2px 4px rgba(0,0,0,.3), 0 4px 10px 2px rgba(0,0,0,.16);
			--md-radius: 16px;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--md-primary: #d0bcff;
				--md-on-primary: #381e72;
				--md-primary-container: #4f378b;
				--md-on-primary-container: #eaddff;
				--md-bg: #141218;
				--md-surface: #1f1d24;
				--md-surface-container: #2b2930;
				--md-on-surface: #e6e1e5;
				--md-on-surface-variant: #cac4d0;
				--md-outline: #938f99;
				--md-outline-variant: #49454f;
				--md-error: #f2b8b5;
				--md-error-container: #5f191f;
				--md-elev-1: 0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.4);
				--md-elev-2: 0 1px 2px rgba(0,0,0,.55), 0 2px 6px 2px rgba(0,0,0,.42);
				--md-elev-3: 0 2px 4px rgba(0,0,0,.55), 0 4px 10px 2px rgba(0,0,0,.45);
			}
		}

		* { box-sizing: border-box; }

		body {
			background: var(--md-bg);
			color: var(--md-on-surface);
			font-family: Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
			font-size: 16px;
			height: 100%;
			margin: 0;
			padding: 0;
			width: 100%;
		}
		h1, h2 { margin: 0; }

		a, a:visited, a:hover, a:active {
			color: inherit;
			text-decoration: none;
		}
		a:focus-visible {
			outline: 2px solid var(--md-primary);
			outline-offset: 2px;
			border-radius: 4px;
		}

		/* ---------- app bar (header) ---------- */
		.header {
			position: sticky;
			top: 0;
			z-index: 10;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 0.75em;
			padding: 1em 1.5em;
			background: var(--md-bg);
			box-shadow: var(--md-elev-1);
		}
		.header img {
			height: 2.4em;
			width: auto;
		}
		.header h1 {
			font-size: 1.45em;
			font-weight: 500;
			letter-spacing: .02em;
			color: var(--md-on-surface);
		}

		/* ---------- loading ---------- */
		.loading {
			align-items: center;
			display: flex;
			flex-direction: column;
			justify-content: center;
			gap: 1.25em;
			min-height: 60vh;
			color: var(--md-on-surface-variant);
		}
		.spinner {
			width: 3.25em;
			height: 3.25em;
			border: .4em solid var(--md-outline-variant);
			border-top-color: var(--md-primary);
			border-radius: 50%;
			animation: md-spin .9s linear infinite;
		}
		@keyframes md-spin { to { transform: rotate(360deg); } }
		.loading p {
			margin: 0;
			font-size: .95em;
			font-weight: 500;
			letter-spacing: .04em;
		}

		/* ---------- error banner ---------- */
		.error {
			display: flex;
			align-items: center;
			justify-content: center;
			width: min(100% - 2em, 40em);
			margin: 1.5em auto;
			padding: 1em 1.5em;
			background: var(--md-error-container);
			color: var(--md-error);
			border-radius: 12px;
			font-weight: 500;
			box-shadow: var(--md-elev-1);
		}

		/* ---------- groups ---------- */
		.group {
			width: min(100% - 2em, 60em);
			margin: 1.75em auto;
		}
		.group-title {
			align-items: center;
			display: flex;
			flex-direction: row;
			gap: .5em;
			padding: .5em .25em;
			user-select: none;
		}
		.group-title.foldable { cursor: pointer; }
		.group-title h2 {
			font-size: .95em;
			font-weight: 600;
			letter-spacing: .08em;
			text-transform: uppercase;
			color: var(--md-on-surface-variant);
			display: flex;
			align-items: center;
			gap: .5em;
		}
		.group-title h2::before {
			content: "";
			width: .35em;
			height: 1em;
			border-radius: 3px;
			background: var(--md-primary);
		}
		.group-title > img {
			width: 1.1em;
			height: 1.1em;
			opacity: .7;
			transition: transform .25s ease;
		}
		.group.folded .group-title > img { transform: rotate(180deg); }

		.group-content {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(7.5em, 1fr));
			gap: 1em;
			padding-top: .5em;
		}

		/* ---------- cards (items) ---------- */
		.item {
			background: var(--md-surface);
			color: var(--md-on-surface);
			min-height: 7.75em;
			padding: 1em .5em;
			text-align: center;
			border-radius: var(--md-radius);
			box-shadow: var(--md-elev-1);
			transition: box-shadow .2s ease, transform .2s ease;
			position: relative;
		}
		.item:hover {
			box-shadow: var(--md-elev-3);
			transform: translateY(-2px);
		}
		.item:active {
			box-shadow: var(--md-elev-2);
			transform: translateY(0) scale(.97);
		}
		.item > a {
			align-items: center;
			display: flex;
			flex-direction: column;
			gap: .6em;
			height: 100%;
			justify-content: center;
		}
		.item > a > img {
			height: 3.9em;
			width: 3.9em;
			object-fit: contain;
			padding: .55em;
			border-radius: 50%;
			background: var(--md-primary-container);
			transition: background .2s ease;
		}
		.item:hover > a > img {
			background: var(--md-surface-container);
		}
		.item > a > span {
			min-height: 2.5em;
			font-size: .85em;
			font-weight: 500;
			line-height: 1.25;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
		}
		/* "small" style (used by site.json) */
		.item.small {
			min-height: 0;
			padding: .85em .4em;
		}
		.item.small > a > img {
			height: 3.5em;
			width: 3.5em;
		}

		/* ---------- kuma uptime status badge ---------- */
		.kuma-badge {
			position: absolute;
			top: .3em;
			right: .3em;
			height: 1em;
			width: auto;
			border-radius: 4px;
			box-shadow: 0 0 0 1px var(--md-outline-variant), var(--md-elev-1);
			opacity: .96;
			pointer-events: none;
		}

		/* ---------- runner (live content card) ---------- */
		.runner {
			max-width: 40em;
			max-height: 40em;
			background: #111;
			color: #fff;
			border-radius: var(--md-radius);
			overflow: hidden;
			padding: .75em;
			box-shadow: var(--md-elev-2);
		}

		/* ---------- footer ---------- */
		.footer {
			text-align: center;
			padding: 1.5em 1em 2.5em;
			font-size: .85em;
			color: var(--md-on-surface-variant);
		}
		.footer a {
			color: var(--md-primary);
			text-decoration: underline;
			text-underline-offset: 3px;
		}

		@media (prefers-reduced-motion: reduce) {
			.item, .item > a > img, .group-title > img, .spinner {
				transition: none;
				animation: none;
			}
		}
	</style>
	<script><!-- dynamic site style -->
		const link = document.createElement('link');
		link.rel = 'stylesheet';
		link.href = 'site.css?ts=' + Date.now();
		document.head.appendChild(link);
	</script>
</head>

<body>

<div x-data="siteManager()" x-init="loadSite()">
	<!-- loading banner -->
	<div x-show="loading" class="loading">
	    <div class="spinner" aria-hidden="true"></div>
	    <p>Loading…</p>
	</div>
	<!-- error message banner -->
	<div x-show="error" class="error">
	    <span x-text="error"></span>
	</div>
	<!-- header -->
	<div x-show="!loading && !error && header" class="header">
		<img x-show="header?.img" :src="header?.img" alt="">
		<h1 x-text="header?.text"></h1>
	</div>
	<!-- content -->
	<template x-for="(group, g_idx) in content" :key="g_idx">
		<!-- group of boxes -->
		<div class="group"
			     :class="group.folded ? 'folded' : ''">
			<!-- group title -->
			<div x-show="group.title" 
			     :class="group.foldable ? 'foldable' : ''"
			     role="button"
			     class="group-title"
			     @click="group.foldable ? group.folded = !group.folded : false">
			<h2 x-text="group.title"></h2>
				<img x-show="group.foldable" :src="group?.folded ? 'unfold.png' : 'fold.png'">
			</div>
			<!-- items in the group -->
			<div class="group-content"
			     x-show="!group.folded" x-transition>
				<template x-for="(item, i_idx) in group.content" :key="g_idx*1000+i_idx">
					<div class="item"
					     :class="[ item.style ? item.style : '', item.run ? 'runner' : '' ]">
						<a :href="item.link ? item.link : 'javascript:void(0)'"
						   :target="item.new_page ? '_blank' : '_self'">
							<img x-show="item.img" :src="item.img">
							<div x-show="item.run" x-init="item.run ? runner($el,item):null">
								<img src="/wait.png">
							</div>
							<span x-show="item.text" x-text="item.text"></span>
						</a>
						<img x-show="item.kumaBadge && item.kumaOk !== false"
						     class="kuma-badge"
						     :src="item.kumaBadge"
						     alt="Uptime status"
						     title="Uptime status (Uptime Kuma)"
						     @error="item.kumaOk = false"
						     loading="lazy">
					</div>
				</template>
			</div>
		</div>
	</template>
	<!-- footer -->
	<div x-show="!loading && !error && footer" class="footer">
		<a :href="footer?.link ? footer.link : 'javascript:void(0)'" target="_blank">
			<span x-show="footer?.text" x-text="footer?.text"></span>
		</a>
	</div>

</div> <!-- end of the fun -->

<script>
document.addEventListener('alpine:init', () => {
	Alpine.data('siteManager', () => ({
		loading: true,
		error: null,
		header: null,
		content: [],
		footer: null,

		runner(el, item) {
				setTimeout(async ()=>{ 
					const response = await fetch( item.run );
					el.innerHTML = await response.text();
					this.runner(el, item);
				}, (item.interval ? item.interval:10) * 1000 );
		},

		kumaBadgeSrc(link) {
			if (!link) return null;
			try {
				const u = new URL(link);
				const nums = (u.pathname.match(/\d+/g) || []);
				const id = nums.length ? nums[nums.length - 1] : null;
				if (!id) return null;
				return `${u.origin}/api/badge/${id}/status`;
			} catch (e) {
				return null;
			}
		},

		async loadSite() {
		try{
			const response = await fetch( "site.json" );
                	const data = await response.json();
			if ( data.title )
				document.title = data.title;
			if ( data.header )
				this.header = data.header;
			if ( data.footer )
				this.footer = data.footer;
			this.content = data.content;
			this.content.forEach(group => {
				(group.content || []).forEach(item => {
					item.kumaBadge = this.kumaBadgeSrc(item.kuma);
				});
			});
		} catch(e) {
			console.error('Failed to fetch site.json', e);
			this.error = "Loading failed: " + e;
		} finally {
			this.loading = false;
		}} // load site.json logic


	}));
});
</script>

</body>
</html>
