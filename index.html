<!DOCTYPE html>
<html lang="it">

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="favicon.png" type="image.png" />
	<meta http-equiv="Cache-Control" content="no-cache">
	<meta http-equiv="Pragma" content="no-cache">
	<title></title>
	<meta charset="UTF-8"/>
	<script defer src="alpine-3.15.12.min.js"></script>
	<script>
		(function () {
			try {
				var t = localStorage.getItem('site-theme');
				if (t === 'light' || t === 'dark')
					document.documentElement.setAttribute('data-theme', t);
				else
					document.documentElement.removeAttribute('data-theme');
			} catch (e) { /* no-op */ }
		})();
	</script>
	<style>
		/* ================= Material Design 3 theme ================= */
		/* Light theme (default) */
		:root {
			--md-primary: #6750a4;
			--md-on-primary: #ffffff;
			--md-primary-container: #eaddff;
			--md-on-primary-container: #21005d;
			--md-bg: #f6f2fb;
			--md-surface: #ffffff;
			--md-surface-container: #ece7f0;
			--md-on-surface: #1d1b20;
			--md-on-surface-variant: #49454f;
			--md-outline: #79747e;
			--md-outline-variant: #cac4d0;
			--md-error: #b3261e;
			--md-error-container: #f9dedc;
			--md-elev-1: 0 1px 2px rgba(0,0,0,.28), 0 1px 3px 1px rgba(0,0,0,.12);
			--md-elev-2: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.14);
			--md-elev-3: 0 2px 4px rgba(0,0,0,.3), 0 4px 10px 2px rgba(0,0,0,.16);
			--md-radius: 16px;
		}
		/* Dark theme: forced via <html data-theme="dark"> (set by the theme button) */
		:root[data-theme="dark"] {
			--md-primary: #d0bcff;
			--md-on-primary: #381e72;
			--md-primary-container: #4f378b;
			--md-on-primary-container: #eaddff;
			--md-bg: #141218;
			--md-surface: #1f1d24;
			--md-surface-container: #2b2930;
			--md-on-surface: #e6e1e5;
			--md-on-surface-variant: #cac4d0;
			--md-outline: #938f99;
			--md-outline-variant: #49454f;
			--md-error: #f2b8b5;
			--md-error-container: #5f191f;
			--md-elev-1: 0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.4);
			--md-elev-2: 0 1px 2px rgba(0,0,0,.55), 0 2px 6px 2px rgba(0,0,0,.42);
			--md-elev-3: 0 2px 4px rgba(0,0,0,.55), 0 4px 10px 2px rgba(0,0,0,.45);
		}
		/* Dark theme: automatic (only when no explicit data-theme is set) */
		@media (prefers-color-scheme: dark) {
			:root:not([data-theme]) {
				--md-primary: #d0bcff;
				--md-on-primary: #381e72;
				--md-primary-container: #4f378b;
				--md-on-primary-container: #eaddff;
				--md-bg: #141218;
				--md-surface: #1f1d24;
				--md-surface-container: #2b2930;
				--md-on-surface: #e6e1e5;
				--md-on-surface-variant: #cac4d0;
				--md-outline: #938f99;
				--md-outline-variant: #49454f;
				--md-error: #f2b8b5;
				--md-error-container: #5f191f;
				--md-elev-1: 0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.4);
				--md-elev-2: 0 1px 2px rgba(0,0,0,.55), 0 2px 6px 2px rgba(0,0,0,.42);
				--md-elev-3: 0 2px 4px rgba(0,0,0,.55), 0 4px 10px 2px rgba(0,0,0,.45);
			}
		}

		* { box-sizing: border-box; }

		body {
			background: var(--md-bg);
			color: var(--md-on-surface);
			font-family: Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
			font-size: 16px;
			min-height: 100vh;
			margin: 0;
			padding: 0;
			width: 100%;
		}
		h1, h2 { margin: 0; }

		a, a:visited, a:hover, a:active {
			color: inherit;
			text-decoration: none;
		}
		a:focus-visible {
			outline: 2px solid var(--md-primary);
			outline-offset: 2px;
			border-radius: 4px;
		}

		/* ---------- app shell (flex column so the footer anchors to the bottom) ---------- */
		.app {
			display: flex;
			flex-direction: column;
			min-height: 100vh;
		}

		/* ---------- app bar (header) ---------- */
		.header {
			position: sticky;
			top: 0;
			left: 0;
			z-index: 10;
			display: flex;
			width: 100%;
			align-items: center;
			justify-content: center;
			gap: 0.75em;
			padding: .75em 4em .75em 1.25em; /* right padding keeps clear of the theme button */
			background: var(--md-bg);
			box-shadow: var(--md-elev-1);
		}
		.header img {
			height: 2.4em;
			width: auto;
		}
		.header h1 {
			font-size: 1.45em;
			font-weight: 500;
			letter-spacing: .02em;
			color: var(--md-on-surface);
		}
		/* ---------- theme switcher (light / dark / auto) ---------- */
		/* fixed: always stays in the top-right corner, in line with the sticky header */
		.theme-toggle {
			position: fixed;
			top: .75em;
			right: .75em;
			z-index: 11;
		}
		.theme-btn {
			align-items: center;
			background: transparent;
			border: none;
			border-radius: 50%;
			color: var(--md-on-surface-variant);
			cursor: pointer;
			display: flex;
			flex-shrink: 0;
			height: 2.4em;
			padding: .4em;
			transition: background .2s ease, color .2s ease;
			-webkit-tap-highlight-color: transparent;
		}
		.theme-btn:hover {
			background: var(--md-surface-container);
			color: var(--md-on-surface);
		}
		.theme-btn:focus-visible {
			outline: 2px solid var(--md-primary);
			outline-offset: 2px;
		}
		.theme-btn svg {
			height: 1.35em;
			width: 1.35em;
			fill: currentColor;
		}

		/* ---------- loading ---------- */
		.loading {
			align-items: center;
			display: flex;
			flex-direction: column;
			justify-content: center;
			gap: 1.25em;
			min-height: 60vh;
			color: var(--md-on-surface-variant);
		}
		.spinner {
			width: 3.25em;
			height: 3.25em;
			border: .4em solid var(--md-outline-variant);
			border-top-color: var(--md-primary);
			border-radius: 50%;
			animation: md-spin .9s linear infinite;
		}
		@keyframes md-spin { to { transform: rotate(360deg); } }
		.loading p {
			margin: 0;
			font-size: .95em;
			font-weight: 500;
			letter-spacing: .04em;
		}

		/* ---------- error banner ---------- */
		.error {
			display: flex;
			align-items: center;
			justify-content: center;
			width: min(100% - 2em, 40em);
			margin: 1.5em auto;
			padding: 1em 1.5em;
			background: var(--md-error-container);
			color: var(--md-error);
			border-radius: 12px;
			font-weight: 500;
			box-shadow: var(--md-elev-1);
		}

		/* ---------- groups ---------- */
		.group {
			width: min(100% - 2em, 60em);
			margin: 1.75em auto;
		}
		.group.folded {
			margin-bottom: 0;
		}
		.group-title {
			align-items: center;
			display: flex;
			flex-direction: row;
			gap: .5em;
			padding: .5em .25em;
			user-select: none;
		}
		.group-title.foldable { cursor: pointer; }
		.group-title h2 {
			font-size: .95em;
			font-weight: 600;
			letter-spacing: .08em;
			text-transform: uppercase;
			color: var(--md-on-surface-variant);
			display: flex;
			align-items: center;
			gap: .5em;
		}
		.group-title h2::before {
			content: "";
			width: .35em;
			height: 1em;
			border-radius: 3px;
			background: var(--md-primary);
		}
		.group-title > img {
			width: 1.1em;
			height: 1.1em;
			opacity: .7;
			transition: transform .25s ease;
		}
		.group.folded .group-title > img { transform: rotate(180deg); }

		.group-content {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(7.5em, 1fr));
			gap: 1em;
			padding-top: .5em;
		}

		/* ---------- cards (items) ---------- */
		.item {
			background: var(--md-surface);
			color: var(--md-on-surface);
			min-height: 7.75em;
			padding: 1em .5em;
			text-align: center;
			border-radius: var(--md-radius);
			box-shadow: var(--md-elev-1);
			transition: box-shadow .2s ease, transform .2s ease;
			position: relative;
		}
		.item:hover {
			box-shadow: var(--md-elev-3);
			transform: translateY(-2px);
		}
		.item:active {
			box-shadow: var(--md-elev-2);
			transform: translateY(0) scale(.97);
		}
		.item > a {
			align-items: center;
			display: flex;
			flex-direction: column;
			gap: .6em;
			height: 100%;
			justify-content: center;
		}
		.item > a > img {
			height: 3.9em;
			width: 3.9em;
			object-fit: contain;
			padding: .55em;
			border-radius: 50%;
			background: var(--md-primary-container);
			transition: background .2s ease;
		}
		.item:hover > a > img {
			background: var(--md-surface-container);
		}
		.item > a > span {
			min-height: 2.5em;
			font-size: .85em;
			font-weight: 500;
			line-height: 1.25;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
		}
		/* "small" style (used by site.json) */
		.item.small {
			min-height: 0;
			padding: .85em .4em;
		}
		.item.small > a > img {
			height: 3.5em;
			width: 3.5em;
		}

		/* ---------- kuma uptime status: badge + simple dot ---------- */
		.kuma-badge {
			position: absolute;
			top: .3em;
			right: .3em;
			height: 1em;
			width: auto;
			border-radius: 4px;
			box-shadow: 0 0 0 1px var(--md-outline-variant), var(--md-elev-1);
			opacity: .96;
			pointer-events: none;
		}
		/* simple red/green status dot ("dot" style) */
		.kuma-dot {
			position: absolute;
			top: .45em;
			right: .45em;
			width: .85em;
			height: .85em;
			border-radius: 50%;
			box-shadow: 0 0 0 1px rgba(0,0,0,.15);
			pointer-events: none;
		}
		.kuma-dot.up        { background: #2e9e44; }
		.kuma-dot.down      { background: var(--md-error); }
		.kuma-dot.maintenance { background: #f5a623; }
		.kuma-dot.unknown   { background: var(--md-outline); }

		/* ---------- runner (live content card) ---------- */
		.runner {
			max-width: 40em;
			max-height: 40em;
			background: #111;
			color: #fff;
			border-radius: var(--md-radius);
			overflow: hidden;
			padding: .75em;
			box-shadow: var(--md-elev-2);
		}

		/* ---------- footer (sticky to the bottom, hugs its content like the header) ---------- */
		.footer {
			position: sticky;
			bottom: 0;
			z-index: 10;
			text-align: center;
			padding: .6em 1em;
			font-size: .85em;
			color: var(--md-on-surface-variant);
			background: var(--md-bg);
			box-shadow: 0 -1px 2px rgba(0,0,0,.28), 0 -1px 3px 1px rgba(0,0,0,.12);
			margin-top: auto;
		}
		.footer a {
			color: var(--md-primary);
			text-decoration: underline;
			text-underline-offset: 3px;
		}

		@media (prefers-reduced-motion: reduce) {
			.item, .item > a > img, .group-title > img, .spinner {
				transition: none;
				animation: none;
			}
		}
	</style>
	<script>
		const link = document.createElement('link');
		link.rel = 'stylesheet';
		link.href = 'site.css?ts=' + Date.now();
		document.head.appendChild(link);
	</script>
</head>

<body>

<div class="app" x-data="siteManager()" x-init="loadSite()">
	<!-- loading banner -->
	<div x-show="loading" class="loading">
	    <div class="spinner" aria-hidden="true"></div>
	    <p>Loading…</p>
	</div>
	<!-- error message banner -->
	<div x-show="error" class="error">
	    <span x-text="error"></span>
	</div>
	<!-- header -->
	<div x-show="!loading && !error && header" class="header">
		<img x-show="header?.img" :src="header?.img" alt="">
		<h1 x-text="header?.text"></h1>
	</div>
	<!-- theme switcher button (light → dark → auto) -->
	<div x-show="!loading && !error" class="theme-toggle">
		<button type="button" id="themeBtn" class="theme-btn">
			<svg id="icon-light" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
			<svg id="icon-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
			<svg id="icon-auto" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9c1.65 0 3 1.35 3 3s-1.35 3-3 3-3-1.35-3-3 1.35-3 3-3m0-2c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM11 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>
		</button>
	</div>
	<!-- content -->
	<template x-for="(group, g_idx) in content" :key="g_idx">
		<!-- group of boxes -->
		<div class="group"
			     :class="group.folded ? 'folded' : ''">
			<!-- group title -->
			<div x-show="group.title" 
			     :class="group.foldable ? 'foldable' : ''"
			     role="button"
			     class="group-title"
			     @click="group.foldable ? group.folded = !group.folded : false">
			<h2 x-text="group.title"></h2>
				<img x-show="group.foldable" :src="group?.folded ? 'unfold.png' : 'fold.png'">
			</div>
			<!-- items in the group -->
			<div class="group-content"
			     x-show="!group.folded" x-transition>
				<template x-for="(item, i_idx) in group.content" :key="g_idx*1000+i_idx">
					<div class="item"
					     :class="[ item.style ? item.style : '', item.run ? 'runner' : '' ]">
						<a :href="item.link ? item.link : 'javascript:void(0)'"
						   :target="item.new_page ? '_blank' : '_self'">
							<img x-show="item.img" :src="item.img">
							<div x-show="item.run" x-init="item.run ? runner($el,item):null">
								<img src="/wait.png">
							</div>
							<span x-show="item.text" x-text="item.text"></span>
						</a>
						<img x-show="kuma.style === 'badge' && item.kumaBadge && item.kumaOk !== false"
						     class="kuma-badge"
						     :src="item.kumaBadge ? item.kumaBadge + '?' + kumaTick : null"
						     alt="Uptime status"
						     title="Uptime status (Uptime Kuma)"
						     @error="item.kumaOk = false"
						     loading="lazy">
						<span x-show="kuma.style === 'dot' && item.kumaBadge"
						      class="kuma-dot"
						      :class="item.kumaState || 'unknown'"
						      :title="'Uptime: ' + (item.kumaState || 'unknown')"></span>
					</div>
				</template>
			</div>
		</div>
	</template>
	<!-- footer -->
	<div x-show="!loading && !error && footer" class="footer">
		<a :href="footer?.link ? footer.link : 'javascript:void(0)'" target="_blank">
			<span x-show="footer?.text" x-text="footer?.text"></span>
		</a>
	</div>

</div> <!-- end of the fun -->

<script>
document.addEventListener('alpine:init', () => {
	Alpine.data('siteManager', () => ({
		loading: true,
		error: null,
		header: null,
		content: [],
		footer: null,
		kuma: { interval: 300, style: 'badge', slug: '' },
		kumaTick: 0,
		kumaTimer: null,
		onVisibility: null,

		runner(el, item) {
				setTimeout(async ()=>{ 
					const response = await fetch( item.run );
					el.innerHTML = await response.text();
					this.runner(el, item);
				}, (item.interval ? item.interval:10) * 1000 );
		},

		kumaBadgeSrc(link) {
			if (!link) return null;
			try {
				const u = new URL(link);
				const nums = (u.pathname.match(/\d+/g) || []);
				const id = nums.length ? nums[nums.length - 1] : null;
				if (!id) return null;
				return `${u.origin}/api/badge/${id}/status`;
			} catch (e) {
				return null;
			}
		},

		refreshKumaBadges() {
			if (document.hidden) return;
			if (this.kuma.style === 'dot') {
				this.content.forEach(group => {
					(group.content || []).forEach(item => {
						if (item.kumaBadge) this.fetchDotStatus(item);
					});
				});
			} else {
				this.content.forEach(group => {
					(group.content || []).forEach(item => {
						if (item.kumaBadge) item.kumaOk = undefined;
					});
				});
				this.kumaTick++;
			}
		},

		async fetchDotStatus(item) {
			try {
				const r = await fetch(item.kumaBadge, { mode: 'cors', cache: 'no-store' });
				const t = await r.text();
				const m = t.match(/aria-label="([^"]+)"/);
				const label = (m ? m[1] : '').toLowerCase();
				if (label.includes('down')) item.kumaState = 'down';
				else if (label.includes('up')) item.kumaState = 'up';
				else if (label.includes('maintenance')) item.kumaState = 'maintenance';
				else item.kumaState = 'unknown';
			} catch (e) {
				if (!item.kumaState) item.kumaState = 'unknown';
			}
		},

		startKumaRefresh() {
			const ms = (this.kuma.interval || 300) * 1000;
			const run  = () => { if (this.kumaTimer) clearInterval(this.kumaTimer); this.kumaTimer = setInterval(() => this.refreshKumaBadges(), ms); };
			const stop = () => { if (this.kumaTimer) { clearInterval(this.kumaTimer); this.kumaTimer = null; } };
			this.onVisibility = () => {
				if (document.hidden) stop();
				else { this.refreshKumaBadges(); run(); }
			};
			document.removeEventListener('visibilitychange', this.onVisibility);
			document.addEventListener('visibilitychange', this.onVisibility);
			// Arm the timer only while visible; populate dots immediately on first paint.
			if (!document.hidden) { run(); if (this.kuma.style === 'dot') this.refreshKumaBadges(); }
		},

		async loadSite() {
		try{
			const response = await fetch( "site.json" );
                	const data = await response.json();
			if ( data.title )
				document.title = data.title;
			if ( data.header )
				this.header = data.header;
			if ( data.footer )
				this.footer = data.footer;
			this.content = data.content;
			if (data.kuma) {
				if (data.kuma.interval) this.kuma.interval = data.kuma.interval;
				if (data.kuma.style) this.kuma.style = data.kuma.style;
				if (data.kuma.slug) this.kuma.slug = data.kuma.slug;
			}
			this.content.forEach(group => {
				(group.content || []).forEach(item => {
					item.kumaBadge = this.kumaBadgeSrc(item.kuma);
				});
			});
			this.startKumaRefresh();
		} catch(e) {
			console.error('Failed to fetch site.json', e);
			this.error = "Loading failed: " + e;
		} finally {
			this.loading = false;
		}} // load site.json logic


	}));
});
</script>

<script><!-- theme switcher: cycles light → dark → auto, persisted in localStorage -->
(function () {
	'use strict';
	var THEMES = ['light', 'dark', 'auto'];
	var LABELS = {
		light: 'Theme: light (click for dark)',
		dark:  'Theme: dark (click for auto)',
		auto:  'Theme: automatic — follows system (click for light)'
	};
	var root = document.documentElement;
	var btn = document.getElementById('themeBtn');
	var icons = {
		light: document.getElementById('icon-light'),
		dark:  document.getElementById('icon-dark'),
		auto:  document.getElementById('icon-auto')
	};
	if (!btn) return;

	function getTheme() {
		try {
			var t = localStorage.getItem('site-theme');
			if (THEMES.indexOf(t) !== -1) return t;
		} catch (e) { /* storage unavailable */ }
		return 'auto';
	}

	function render(t) {
		Object.keys(icons).forEach(function (k) {
			if (icons[k]) icons[k].style.display = (k === t) ? 'block' : 'none';
		});
		btn.setAttribute('aria-label', LABELS[t]);
		btn.title = LABELS[t];
	}

	function cycle() {
		var next = THEMES[(THEMES.indexOf(getTheme()) + 1) % THEMES.length];
		try { localStorage.setItem('site-theme', next); } catch (e) { /* storage unavailable */ }
		if (next === 'auto') root.removeAttribute('data-theme');
		else root.setAttribute('data-theme', next);
		render(next);
	}

	render(getTheme());
	btn.addEventListener('click', cycle);
})();
</script>
